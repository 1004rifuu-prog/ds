<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VOID_CONSOLE</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            color: #00ff66;
            user-select: none;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            z-index: 5;
        }
        .hud-panel {
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid #00ff66;
            padding: 15px;
            pointer-events: auto;
            max-width: 380px;
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.3);
        }
        h1 { font-size: 0.9rem; margin: 0 0 8px 0; letter-spacing: 2px; }
        .log { font-size: 0.85rem; line-height: 1.4; color: #00ff66; }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background: rgba(0, 255, 102, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 4;
        }
        /* スマホの画面全体が強烈に発光するレイヤー（物理ライトの代わり） */
        #screen-flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 1);
            pointer-events: none;
            transition: background 0.3s ease;
            z-index: 1;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="screen-flash"></div>
    <div id="crosshair"></div>

    <div id="ui-layer">
        <div class="hud-panel">
            <h1>[VOID_CONSOLE // SEC_01]</h1>
            <div class="log" id="log-text">……おい。目を覚ませ。<br>完全な暗闇だ。怖じ気づいている場合か？<br><span style="color:#888; font-size:0.75rem;">（画面をタップして周囲を観察せよ）</span></div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, raycaster;
        let isRunning = false;
        let spotlight, ambientLight;
        let interactiveObjects = [];
        let yaw = 0; 
        let currentPhase = 1;
        
        let isDragging = false;
        let previousX = 0;
        let touchStartX = 0;

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x010101);
            scene.fog = new THREE.FogExp2(0x010101, 0.1);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();

            // 環境光
            ambientLight = new THREE.AmbientLight(0x020202);
            scene.add(ambientLight);

            // 3D空間内のライト
            spotlight = new THREE.SpotLight(0xccffdd, 0, 20, Math.PI / 5, 0.4, 1);
            spotlight.position.set(0, 1.6, 0);
            camera.add(spotlight);
            scene.add(camera);

            // 部屋の構築
            const roomGeo = new THREE.BoxGeometry(10, 4, 16);
            const roomMat = new THREE.MeshBasicMaterial({ color: 0x101010, side: THREE.BackSide });
            const room = new THREE.Mesh(roomGeo, roomMat);
            room.position.set(0, 2, 0);
            scene.add(room);

            // 認証パネル
            const panelGeo = new THREE.PlaneGeometry(1.4, 2.0);
            const panelMat = new THREE.MeshBasicMaterial({ color: 0x003311, wireframe: true });
            const panel = new THREE.Mesh(panelGeo, panelMat);
            panel.position.set(0, 1.8, -7.8);
            panel.name = "MAIN_PANEL";
            scene.add(panel);
            interactiveObjects.push(panel);

            setupControls();
            isRunning = true;
            animate();
        }

        function updateLog(msg) {
            document.getElementById('log-text').innerHTML = msg;
        }

        function setupControls() {
            window.addEventListener('mousedown', (e) => { isDragging = true; previousX = e.clientX; });
            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                let deltaX = e.clientX - previousX;
                yaw -= deltaX * 0.003;
                previousX = e.clientX;
            });
            window.addEventListener('mouseup', (e) => {
                if (isDragging && Math.abs(e.clientX - previousX) < 5) { checkInteraction(); }
                isDragging = false;
            });

            window.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    previousX = e.touches[0].clientX;
                    touchStartX = e.touches[0].clientX;
                }
            });
            window.addEventListener('touchmove', (e) => {
                if (!isDragging || e.touches.length !== 1) return;
                let deltaX = e.touches[0].clientX - previousX;
                yaw -= deltaX * 0.004;
                previousX = e.touches[0].clientX;
            });
            window.addEventListener('touchend', (e) => {
                if (isDragging && Math.abs(previousX - touchStartX) < 10) { checkInteraction(); }
                isDragging = false;
            });

            // 初回タップで確実に起動
            window.addEventListener('click', () => {
                if (!scene) init3D();
            }, { once: true });
        }

        function checkInteraction() {
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(interactiveObjects);

            if (intersects.length > 0) {
                const obj = intersects[0].object;
                
                if (obj.name === "MAIN_PANEL") {
                    if (currentPhase === 1) {
                        // ハッカーのセリフ ＆ スマホ画面が爆発的に発光する演出（100%確実動作）
                        updateLog("……暗くて何も見えないな。<br>ハッカー：『何をぼんやりしている？ お前の手元にある端末の画面を発光させてみろよ』");
                        
                        // 画面全体を強烈に発光させる
                        document.getElementById('screen-flash').style.background = 'rgba(204, 255, 221, 0.25)';
                        spotlight.intensity = 4.0;
                        ambientLight.intensity = 0.2;
                        
                        if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
                        
                        currentPhase = 2;
                    } else {
                        updateLog("パネルの暗号入力を完了した。<br>ハッカー：『ふむ…上出来だ。次のプロトコルへ進むぞ』");
                        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                        obj.material.color.setHex(0x00ff66);
                    }
                }
            }
        }

        function animate() {
            if (!isRunning) return;
            requestAnimationFrame(animate);
            camera.rotation.y = yaw;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if (!camera) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
